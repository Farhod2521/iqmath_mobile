dependency_overrides:
  # permission_handler 13.x -> permission_handler_android 14.x compileSdk 37 ('android-37')
  # talab qiladi, o'rnatilgan SDK esa 'android-37.0' deb nomlanadi va AGP uni topa olmaydi.
  # chuck_interceptor '>=11.3.1 <14.0.0' ni qabul qiladi, 12.x SDK 35 bilan ishlaydi.
  permission_handler: 12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.8.0
#  bloc_test: ^10.0.0
#  hive_generator: ^2.0.1
#  mockito: ^5.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/png/
    - assets/fonts/
    - assets/svg/
    - assets/lottie/
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/SFProText-Bold.ttf
          weight: 700
        - asset: assets/fonts/SFProText-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProText-Regular.ttf
          weight: 400

flutter_intl:
  enabled: true
  class_name: AppLocalization
  arb-dir: lib/localization/l10n
  preferred-supported-locales:
    - en
  use-deferred-loading: true
